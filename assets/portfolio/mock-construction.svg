  <text x="482" y="110" fill="#5b9fd4" font-family="IBM Plex Mono, monospace" font-size="9">RECONCILED</text>
  <text x="482" y="134" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="20">98%</text>
  <!-- Chart area -->
  <rect x="32" y="168" width="380" height="156" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <polyline fill="none" stroke="#5b9fd4" stroke-width="2.5" points="52,290 90,270 128,250 166,255 204,220 242,210 280,195 318,185 356,175 394,160"/>
  <polyline fill="none" stroke="rgba(91,159,212,0.35)" stroke-width="1.5" stroke-dasharray="4 3" points="52,300 90,285 128,275 166,268 204,250 242,245 280,230 318,225 356,210 394,200"/>
  <text x="44" y="186" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">PRODUCTION TREND</text>
