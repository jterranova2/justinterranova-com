<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustrative construction BI dashboard mock">
  <rect width="640" height="360" fill="#10141c"/>
  <rect x="16" y="16" width="608" height="328" rx="10" fill="#0b0e14" stroke="rgba(255,255,255,0.1)"/>
