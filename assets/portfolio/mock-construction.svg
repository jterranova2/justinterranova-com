  <text x="190" y="134" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="20">18</text>
  <rect x="324" y="88" width="130" height="64" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="336" y="110" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">JOBS CLOSED</text>
  <text x="336" y="134" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="20">142</text>
