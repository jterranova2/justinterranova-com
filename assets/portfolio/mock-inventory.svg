<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustrative inventory accuracy dashboard mock">
  <rect width="640" height="360" fill="#10141c"/>
  <rect x="16" y="16" width="608" height="328" rx="10" fill="#0b0e14" stroke="rgba(255,255,255,0.1)"/>
  <text x="32" y="44" fill="#5b9fd4" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1">INVENTORY · VARIANCE</text>
  <text x="32" y="68" fill="#e8ecf4" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="600">Accuracy Control</text>
  <rect x="32" y="88" width="200" height="80" rx="8" fill="rgba(91,159,212,0.12)" stroke="rgba(91,159,212,0.35)"/>
  <text x="44" y="112" fill="#5b9fd4" font-family="IBM Plex Mono, monospace" font-size="9">ACCURACY</text>
  <text x="44" y="144" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="26">75%→99%</text>
  <rect x="248" y="88" width="180" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="260" y="112" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">MONTHLY VARIANCE</text>
  <text x="260" y="144" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="26">&lt;$5k</text>
  <rect x="444" y="88" width="164" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="456" y="112" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">LINE-DOWN</text>
  <text x="456" y="144" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="26">Zero</text>
  <!-- Gauge-ish ring -->
  <rect x="32" y="188" width="280" height="136" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="172" cy="256" r="48" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
  <circle cx="172" cy="256" r="48" fill="none" stroke="#5b9fd4" stroke-width="10" stroke-dasharray="285 301" stroke-linecap="round" transform="rotate(-90 172 256)"/>
  <text x="172" y="252" text-anchor="middle" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="18">99%</text>
  <text x="172" y="272" text-anchor="middle" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">TARGET MET</text>
  <rect x="328" y="188" width="280" height="136" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="340" y="208" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">VARIANCE TREND</text>
  <polyline fill="none" stroke="#5b9fd4" stroke-width="2.5" points="350,300 390,280 430,260 470,240 510,220 550,205 580,200"/>
  <text x="340" y="310" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="8">Illustrative layout</text>
</svg>
