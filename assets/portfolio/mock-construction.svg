  <text x="44" y="134" fill="#e8ecf4" font-family="IBM Plex Mono, monospace" font-size="20">4.2d</text>
  <rect x="178" y="88" width="130" height="64" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
