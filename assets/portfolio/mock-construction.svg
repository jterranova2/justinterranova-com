  <rect x="428" y="168" width="180" height="156" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="440" y="186" fill="#9aa3b5" font-family="IBM Plex Mono, monospace" font-size="9">STATUS MIX</text>
  <rect x="440" y="202" width="120" height="10" rx="3" fill="rgba(91,159,212,0.7)"/>
  <rect x="440" y="222" width="90" height="10" rx="3" fill="rgba(91,159,212,0.45)"/>
  <rect x="440" y="242" width="70" height="10" rx="3" fill="rgba(91,159,212,0.3)"/>
  <rect x="440" y="262" width="45" height="10" rx="3" fill="rgba(154,163,181,0.35)"/>
