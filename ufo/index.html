<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFO Office</title>
<style>
  :root { --panel: rgba(14,18,28,.88); --ink: #e8f1ff; --dim: #93a3bd; --accent: #7fe3ff; --line: rgba(127,227,255,.25); }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); }
  /* The striped background stands in for passthrough in the desktop preview:
     anywhere you see stripes is where the headset would show your real room. */
  body { background: repeating-linear-gradient(45deg, #3b3a38 0 14px, #45433f 14px 28px); }
  canvas { display: block; }
  #hud { position: fixed; top: 16px; left: 16px; width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
         background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-sizing: border-box; backdrop-filter: blur(6px); }
  #hud h1 { font-size: 18px; margin: 0 0 2px; }
  #hud p { margin: 4px 0 10px; color: var(--dim); font-size: 12.5px; }
  #hud h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button, .file { font: inherit; font-size: 13px; color: var(--ink); background: #1d2535; border: 1px solid #2f3b52; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  button:hover, .file:hover { border-color: var(--accent); }
  button.on { background: #12485a; border-color: var(--accent); }
  #enter { width: 100%; padding: 11px; font-size: 15px; font-weight: 600; background: #1a6b55; border-color: #38c79c; margin-top: 4px; }
  #enter:disabled { background: #2a2f3a; border-color: #3a4152; color: var(--dim); cursor: default; }
  .file input { display: none; }
  #status { font-size: 12px; color: var(--accent); margin-top: 10px; min-height: 1.2em; }
  #hide { position: absolute; top: 10px; right: 10px; padding: 2px 8px; }
  #show { position: fixed; top: 16px; left: 16px; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <button id="hide" title="Hide panel">–</button>
  <h1>🛸 UFO Office</h1>
  <p>Your real desk stays in front of you. Everything past it becomes a flying saucer. Drag to look around.</p>
  <button id="enter" disabled>Checking for headset…</button>

  <h2>Outside the window</h2>
  <div class="row" id="scenes"></div>

  <h2>Festival cam: demo clip, or load your own video</h2>
  <div class="row">
    <label class="file">Load video…<input type="file" id="file" accept="video/*"></label>
    <button data-act="demo">Demo clip</button>
    <button data-act="videoMode" id="vmode"></button>
    <button data-act="play" id="play">Play / pause</button>
  </div>

  <h2>Ship &amp; room</h2>
  <div class="row">
    <button data-act="rotate">Rotate ship 15°</button>
    <button data-act="outline" id="outline">Room outline</button>
    <button data-act="floor" id="floor">Real floor</button>
    <button data-act="clear">Clear real zones</button>
  </div>
  <div id="status"></div>
</div>
<button id="show">🛸 Menu</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// The shell: owns the renderer, camera and headset session, and never reloads.
// The ship and everything in it lives in world.js, which is swapped in live whenever it changes.
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);           // alpha 0 = passthrough shows wherever nothing is drawn
renderer.xr.enabled = true;
// 'local', not 'local-floor': asking the Quest for its floor pulls up its saved play-area boundary (and that floor
// can be wrong). The world measures the floor from the room scan instead.
renderer.xr.setReferenceSpaceType('local');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 4000);
camera.position.set(0, 1.45, 1.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, -0.6);
controls.enableDamping = true;
controls.maxDistance = 2.0;
controls.enablePan = false;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
for (const i of [0, 1]) {
  const c = renderer.xr.getController(i);
  c.addEventListener('connected', e => { c.userData.src = e.data; });
  c.addEventListener('disconnected', () => { c.userData.src = null; });
  scene.add(c);
}

const shell = window.__ufoShell = { THREE, renderer, scene, camera, controls, state: {}, world: null };
let version = 0;
async function loadWorld() {
  try { await import(`./world.js?v=${++version}`); }
  catch (e) { console.error('world.js failed to load, so the previous version is still running:', e); }
}
loadWorld();
renderer.setAnimationLoop((now, frame) => {
  try { shell.world?.frame(now, frame); } catch (e) { console.error(e); }
  renderer.render(scene, camera);
});

// Hooks for the XR bridge (only present while developing; harmless on the live site).
window.__xrBridgeApp = {
  THREE, renderer, scene, camera,
  describe: () => shell.world?.describe?.(),
  hot(files) {
    if (files.some(f => f.endsWith('.html'))) return false;   // the shell itself changed: needs a reload
    if (files.some(f => f.endsWith('.js'))) loadWorld();
    return true;
  },
};
</script>
</body>
</html>
