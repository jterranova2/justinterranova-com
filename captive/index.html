<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Captive — Prototype 1</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --ink: #f3ece2; --dim: rgba(243,236,226,.7); --panel: rgba(18,14,10,.62); --accent: #d9a35b; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #desk { position: fixed; inset: 0; background: linear-gradient(#4b4038, #2a221c 55%, #6b513a 55%, #8a6a4a); }
  canvas { position: fixed; inset: 0; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0a08; z-index: 5; text-align: center; padding: 24px; }
  #start h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: .02em; }
  #start p { color: var(--dim); max-width: 32ch; margin: 0 auto 20px; }
  button { font: inherit; color: #1a120a; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--panel);
    padding: 12px max(16px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  #ui label { display: grid; grid-template-columns: 7.5em 1fr 3.5em; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  #ui input { width: 100%; }
  #ui .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  #ui button { padding: 8px 14px; font-size: 13px; }
  #msg { font-size: 12px; color: var(--dim); }
  /* where the hand tracker sees your pinch: hollow = hand seen, amber ring = over her, filled = holding */
  #pinch { position: fixed; left: 0; top: 0; width: 18px; height: 18px; margin: -11px 0 0 -11px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.85); pointer-events: none; z-index: 2; transition: background .1s, border-color .1s; }
  /* status line for troubleshooting on the phone: sound, hand tracker, finger gap */
  #diag { position: fixed; z-index: 3; left: max(10px, env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top));
    font: 11px/1.3 ui-monospace, Menlo, monospace; color: #fff; background: rgba(0,0,0,.45); padding: 4px 7px; border-radius: 6px; pointer-events: none; }
  #occ { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #pinch.over { border-color: var(--accent); }
  #pinch.pinch { background: rgba(255,255,255,.8); }
  #pinch.holding { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay hidden></video>
<div id="desk" hidden></div>
<div id="pinch" hidden></div>
<div id="diag" hidden></div>

<div id="start">
  <div>
    <h1>Captive</h1>
    <p>Point your phone at your desk. Someone very small is there.</p>
    <button id="go">Start camera</button>
  </div>
</div>

<div id="ui" hidden>
  <label>Distance <input id="dist" type="range" min="20" max="120" value="45"><span id="distv"></span></label>
  <label>Desk below cam <input id="drop" type="range" min="5" max="80" value="30"><span id="dropv"></span></label>
  <div class="row"><span id="msg">Touch her to pick her up. Let go to drop her.</span><span class="row" style="gap:8px"><button id="calib">Set desk</button><button id="mute">Mute</button><button id="recenter">Recenter</button></span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mediapipe": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { FilesetResolver, HandLandmarker } from 'mediapipe';

// Microsoft Rocketbox "Female_Adult_01" (MIT license), textures shrunk to 1024px
const MODEL_DIR = 'models/f01/';
const HEIGHT_M = 0.15;               // she stands 15 cm tall

const $ = id => document.getElementById(id);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 20);

// soft, warm room light: strong sky fill, gentle key, so she sits in the room instead of on a stage
scene.add(new THREE.HemisphereLight(0xfff1e0, 0x4a3a2c, 1.5));
const key = new THREE.DirectionalLight(0xffe9d2, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.1; key.shadow.camera.far = 3;
key.shadow.camera.left = key.shadow.camera.bottom = -0.2;
key.shadow.camera.right = key.shadow.camera.top = 0.2;
key.shadow.radius = 4;
key.shadow.bias = -0.0005;
scene.add(key, key.target);

// "stage" = her spot on the desk; everything about her hangs off it
const stage = new THREE.Group();
scene.add(stage);

// invisible desk surface that only receives her shadow
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.38 }));
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
stage.add(shadowCatcher);

// soft contact shadow right under her feet, so she never looks like she floats
const blobTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const blob = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.045), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.0005;
stage.add(blob);

// ---------- her textures ----------
const texLoader = new THREE.TextureLoader();
const loadTex = (file, color) => {
  const t = texLoader.load(MODEL_DIR + file);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  return t;
};

// Wear her clothes down: faded, stained blouse, dirty jeans, a film of grime over everything.
function captiveClothes(tex) {
  const img = tex.image, c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], gr = p[i + 1], b = p[i + 2], max = Math.max(r, gr, b), min = Math.min(r, gr, b);
    const sat = max ? (max - min) / max : 0, lum = (r + gr + b) / 3;
    let h = 0;
    if (max !== min) h = max === r ? 60 * ((gr - b) / (max - min)) : max === gr ? 60 * (2 + (b - r) / (max - min)) : 60 * (4 + (r - gr) / (max - min));
    if (h < 0) h += 360;
    const x = (i / 4) % c.width, y = (i / 4 / c.width) | 0;
    const grime = 0.8 + 0.2 * Math.sin(x * 0.05 + Math.sin(y * 0.04) * 3) * Math.sin(y * 0.07 + x * 0.011);
    let R = r, G = gr, B = b;
    if ((h > 290 || h < 6) && sat > 0.2) {             // pink blouse -> faded, dusty
      R = lum * 1.05 + 12; G = lum * 0.95 + 4; B = lum * 0.85;
    } else if (h > 190 && h < 250 && sat > 0.15) {     // jeans -> washed-out, dirty denim
      R = lum * 0.85 + 8; G = lum * 0.88 + 8; B = lum * 0.95 + 4;
    }
    p[i] = R * grime; p[i + 1] = G * grime; p[i + 2] = B * grime;
  }
  g.putImageData(d, 0, 0);
  const out = new THREE.CanvasTexture(c);
  out.colorSpace = THREE.SRGBColorSpace; out.flipY = tex.flipY;
  return out;
}

// ---------- the woman ----------
let woman = null, mesh = null, bones = {}, rest = {}, morph = {};
// Pose names (left) -> her skeleton's bone names (3ds Max Biped)
const RIG = {
  Hips: 'Bip01_Pelvis', Spine: 'Bip01_Spine', Spine1: 'Bip01_Spine1', Spine2: 'Bip01_Spine2',
  Neck: 'Bip01_Neck', Head: 'Bip01_Head',
  LeftArm: 'Bip01_L_UpperArm', LeftForeArm: 'Bip01_L_Forearm', LeftHand: 'Bip01_L_Hand',
  RightArm: 'Bip01_R_UpperArm', RightForeArm: 'Bip01_R_Forearm', RightHand: 'Bip01_R_Hand',
  LeftUpLeg: 'Bip01_L_Thigh', LeftLeg: 'Bip01_L_Calf', LeftFoot: 'Bip01_L_Foot', LeftToe: 'Bip01_L_Toe0',
  RightUpLeg: 'Bip01_R_Thigh', RightLeg: 'Bip01_R_Calf', RightFoot: 'Bip01_R_Foot', RightToe: 'Bip01_R_Toe0',
};

const manager = new THREE.LoadingManager();
manager.setURLModifier(u => /\.tga$/i.test(u) ? 'data:,' : u);   // we supply our own shrunken textures
new FBXLoader(manager).load(MODEL_DIR + 'f01.fbx', fbx => {
  woman = fbx;
  const mats = {
    f001_body: new THREE.MeshStandardMaterial({ normalMap: loadTex('body_normal.jpg'), roughness: 0.85 }),
    f001_head: new THREE.MeshStandardMaterial({ map: loadTex('head_color.jpg', true), normalMap: loadTex('head_normal.jpg'), roughness: 0.6 }),
    f001_opacity: new THREE.MeshStandardMaterial({ map: loadTex('opacity.png', true), alphaTest: 0.35, side: THREE.DoubleSide, roughness: 0.7 }),
  };
  // once the body texture arrives, repaint it worn and dirty
  texLoader.load(MODEL_DIR + 'body_color.jpg', t => { mats.f001_body.map = captiveClothes(t); mats.f001_body.needsUpdate = true; });
  fbx.traverse(o => {
    if (o.isMesh) {
      o.material = [].concat(o.material).map(m => mats[m.name] || m);
      o.castShadow = true; o.frustumCulled = false;
      if (o.morphTargetDictionary) {
        mesh = o;
        for (const [k, i] of Object.entries(o.morphTargetDictionary)) morph[k.replace(/^.*\./, '')] = i;
      }
    }
  });
  for (const [pose, name] of Object.entries(RIG)) {
    const b = fbx.getObjectByName(name);
    if (b) { bones[pose] = b; rest[pose] = b.quaternion.clone(); }
  }
  woman.scale.setScalar(HEIGHT_M / 174);    // model is 174 cm tall in its own units
  stage.add(woman);
  window.__bones = bones; window.__morph = morph; window.__mesh = mesh;
}, undefined, e => { $('msg').textContent = 'Could not load her model: ' + e.message; });

// ---------- frightened stance ----------
// Each limb is aimed along a direction in HER body frame:
// x = her left, y = up, z = the way she faces. Works for any skeleton.
const AIM = [
  ['LeftArm',     'LeftForeArm', [ 0.22, -0.88,  0.42]],   // upper arms tucked in, a little forward
  ['RightArm',    'RightForeArm',[-0.22, -0.88,  0.42]],
  ['LeftForeArm', 'LeftHand',    [-0.55,  0.62,  0.56]],   // forearms folded up, hands at her chest
  ['RightForeArm','RightHand',   [ 0.55,  0.62,  0.56]],
  ['LeftUpLeg',   'LeftLeg',     [ 0.04, -0.94,  0.34]],   // knees bent, ready to bolt
  ['RightUpLeg',  'RightLeg',    [-0.04, -0.94,  0.34]],
  ['LeftLeg',     'LeftFoot',    [ 0.02, -0.95, -0.30]],
  ['RightLeg',    'RightFoot',   [-0.02, -0.95, -0.30]],
];
const BEND = { Spine: 0.22, Spine1: 0.14, Spine2: 0.08, Neck: -0.45 };   // hunched forward, chin up to watch (radians)
// Fear on her face (0..1 per expression control)
const FEAR = {
  AK_03_BrowInnerUp: 0.9, AK_04_BrowOuterUpLeft: 0.45, AK_05_BrowOuterUpRight: 0.45,
  AK_21_EyeWideLeft: 0.75, AK_22_EyeWideRight: 0.75,
  AK_46_MouthStretchLeft: 0.45, AK_47_MouthStretchRight: 0.45, AK_25_JawOpen: 0.12,
};
window.__AIM = AIM; window.__BEND = BEND; window.__FEAR = FEAR; window.__stage = stage; window.__cam = camera;

const tmpQ = new THREE.Quaternion(), bodyQ = new THREE.Quaternion(), parQ = new THREE.Quaternion(),
      vRest = new THREE.Vector3(), vWant = new THREE.Vector3(), axis = new THREE.Vector3(),
      toeL = new THREE.Vector3(), toeR = new THREE.Vector3(), stW = new THREE.Vector3();
// rotate a bone (from its rest pose) about an axis given in her body frame
function turn(name, ax, angle) {
  const b = bones[name]; if (!b) return;
  b.parent.getWorldQuaternion(parQ);
  axis.set(...ax).applyQuaternion(bodyQ).applyQuaternion(parQ.invert());
  b.quaternion.copy(tmpQ.setFromAxisAngle(axis, angle)).multiply(rest[name]);
  b.updateMatrixWorld(true);
}
function aim(name, childName, dir) {
  const b = bones[name], c = bones[childName]; if (!b || !c) return;
  b.parent.getWorldQuaternion(parQ).invert();
  vRest.copy(c.position).normalize().applyQuaternion(rest[name]);          // limb direction at rest, parent space
  vWant.set(...dir).normalize().applyQuaternion(bodyQ).applyQuaternion(parQ);
  b.quaternion.setFromUnitVectors(vRest, vWant).multiply(rest[name]);
  b.updateMatrixWorld(true);
}
// ---------- what she's doing: on the desk, held by you, falling ----------
let state = 'ground', fear = 0.4, stumble = 0, vy = 0, hb = 0;   // hb: 0 = desk pose, 1 = dangling pose (blended)
const holdLocal = new THREE.Vector3(), gripLocal = new THREE.Vector3(), grabEase = new THREE.Vector3(),
      gripPrev = new THREE.Vector3(), gripVel = new THREE.Vector3(), gripAcc = new THREE.Vector3(), vel = new THREE.Vector3(),
      chestW = new THREE.Vector3(), lowToe = new THREE.Vector3(), tmpV = new THREE.Vector3();
let grabAge = 1, gripFresh = true;
// She hangs from your fingers like a pendulum: px tilts her forward/back, pz side to side.
const pend = { x: 0, z: 0, vx: 0, vz: 0 };
const PEND_L = 0.04, PEND_DAMP = 4.5;                     // 4 cm from your grip to her centre of mass: swings ~2.5x a second
// Being dangled: hands shoving and prying at the thumb in front of her, now and then breaking
// into flailing; legs kicking (same body frame and order as AIM)
function heldAim(t) {
  const k = Math.sin(t * 9), a = Math.sin(t * 6), b = Math.sin(t * 6 + 1.7);
  const flail = Math.max(0, Math.sin(t * 1.1)) ** 2;      // 0 = pushing at your fingers, 1 = flailing
  const mix = (p, f) => lerp3(p, f, flail);
  return [
    ['LeftArm',     'LeftForeArm', mix([ 0.45, -0.2 + 0.12 * a, 0.85], [ 0.8, 0.25 + 0.4 * a, 0.3])],
    ['RightArm',    'RightForeArm',mix([-0.45, -0.2 + 0.12 * b, 0.85], [-0.8, 0.25 + 0.4 * b, 0.3])],
    ['LeftForeArm', 'LeftHand',    mix([-0.4,  0.35 + 0.15 * b, 0.85], [ 0.45, 0.8 + 0.3 * b, 0.35])],
    ['RightForeArm','RightHand',   mix([ 0.4,  0.35 + 0.15 * a, 0.85], [-0.45, 0.8 + 0.3 * a, 0.35])],
    ['LeftUpLeg',   'LeftLeg',     [ 0.08, -0.9, 0.2 + 0.5 * k]],
    ['RightUpLeg',  'RightLeg',    [-0.08, -0.9, 0.2 - 0.5 * k]],
    ['LeftLeg',     'LeftFoot',    [ 0.02, -0.9, -0.15 - 0.6 * Math.max(0, k)]],
    ['RightLeg',    'RightFoot',   [-0.02, -0.9, -0.15 - 0.6 * Math.max(0, -k)]],
  ];
}
const HELD_BEND = { Spine: 0.14, Spine1: 0.1, Spine2: 0.05, Neck: -0.35 };   // curled toward your fingers, looking up at you
// Thrown off balance on landing: deep crouch that eases back to the cower
const CROUCH = { LeftUpLeg: [0.1, -0.55, 0.85], RightUpLeg: [-0.1, -0.55, 0.85], LeftLeg: [0.02, -0.75, -0.65], RightLeg: [-0.02, -0.75, -0.65] };
const lerp3 = (p, q, s) => [p[0] + (q[0] - p[0]) * s, p[1] + (q[1] - p[1]) * s, p[2] + (q[2] - p[2]) * s];

// Swing physics: your grip's acceleration pushes her body the other way; gravity pulls it back under.
function swing(dt) {
  if (state === 'held') {
    tmpV.copy(gripLocal).sub(gripPrev).divideScalar(dt);
    if (gripFresh) { tmpV.set(0, 0, 0); gripFresh = false; }
    gripAcc.lerp(tmpV.clone().sub(gripVel).divideScalar(dt), 0.15);      // smoothed: tracking noise mustn't shake her
    if (gripAcc.length() > 9) gripAcc.setLength(9);                       // even a violent jerk only swings her so far
    gripVel.lerp(tmpV, 0.4);
  } else gripAcc.set(0, 0, 0);
  gripPrev.copy(gripLocal);
  const g = state === 'held' ? 9.8 : 0, n = 4, h = dt / n;
  // past ~35 degrees her shoulders resist, like a real body (soft limit, no dead stop)
  const limit = a => Math.sign(a) * Math.max(0, Math.abs(a) - 0.6) * 500;
  for (let i = 0; i < n; i++) {
    pend.vx += (-(g / PEND_L) * Math.sin(pend.x) + (gripAcc.z / PEND_L) * Math.cos(pend.x) - PEND_DAMP * pend.vx - limit(pend.x)) * h;
    pend.vz += (-(g / PEND_L) * Math.sin(pend.z) - (gripAcc.x / PEND_L) * Math.cos(pend.z) - PEND_DAMP * pend.vz - limit(pend.z)) * h;
    if (state !== 'held') { pend.vx -= pend.x * 40 * h; pend.vz -= pend.z * 40 * h; pend.vx *= 0.9; pend.vz *= 0.9; }   // stands back upright
    pend.x += pend.vx * h; pend.z += pend.vz * h;
  }
}

let nextBlink = 2, blinkT = -1;
function pose(t, dt) {
  if (!woman) return;
  const held = state === 'held';
  fear = Math.max(0.4, fear - dt * 0.06);                                  // calms down slowly
  stumble = Math.max(0, stumble - dt * 1.4);
  hb += ((state === 'ground' ? 0 : 1) - hb) * (1 - Math.exp(-dt * (state === 'ground' ? 7 : 8)));   // poses blend, never snap
  const shiver = (Math.sin(t * 38) * 0.012 + Math.sin(t * 23.7) * 0.008) * (0.6 + fear);   // trembling
  const breath = Math.sin(t * (6 + fear * 4)) * 0.035;                     // fast, shallow breaths
  const glance = (Math.sin(t * 0.7) * 0.5 + Math.sin(t * 1.9) * 0.15) * (1 - hb) + Math.sin(t * 3) * 0.25 * hb;
  swing(dt);
  woman.rotation.set(pend.x, Math.sin(t * 0.31) * 0.15, pend.z);
  woman.updateMatrixWorld(true);
  woman.getWorldQuaternion(bodyQ);                                         // her facing (model is y-up, faces +z)
  for (const [n, x] of Object.entries(BEND)) turn(n, [1, 0, 0], x + (HELD_BEND[n] - x) * hb + (n === 'Spine1' ? breath : 0));
  bones.Head && (bones.Head.parent.getWorldQuaternion(parQ),               // look around, nod with the shiver
    bones.Head.quaternion.copy(rest.Head)
      .premultiply(tmpQ.setFromAxisAngle(axis.set(0, 1, 0).applyQuaternion(bodyQ).applyQuaternion(parQ.clone().invert()), glance))
      .premultiply(tmpQ.setFromAxisAngle(axis.set(1, 0, 0).applyQuaternion(bodyQ).applyQuaternion(parQ.invert()), shiver * 2)),
    bones.Head.updateMatrixWorld(true));
  const dangle = heldAim(t);
  AIM.forEach(([n, c, dg], i) => {
    const dh = dangle[i][2];
    let dir = lerp3([dg[0] + shiver, dg[1], dg[2]], [dh[0] + shiver, dh[1], dh[2]], hb);
    if (CROUCH[n]) dir = lerp3(dir, CROUCH[n], stumble * (1 - hb));
    aim(n, c, dir);
  });
  placeBody(dt);
  // face: fear, screaming while held, plus blinks and darting eyes
  if (mesh) {
    const inf = mesh.morphTargetInfluences;
    for (const [k, v] of Object.entries(FEAR)) if (morph[k] !== undefined) inf[morph[k]] = Math.min(1, v * (0.8 + fear * 0.5));
    // mouth opens with her voice; held, it never fully closes
    const m = Math.max(voice.mouth, 0.35 * hb);
    for (const [k, v] of [['AK_25_JawOpen', 0.1 + m * 0.75], ['AK_46_MouthStretchLeft', 0.4 + m * 0.5], ['AK_47_MouthStretchRight', 0.4 + m * 0.5]])
      if (morph[k] !== undefined) inf[morph[k]] = Math.min(1, v);
    if (t > nextBlink) { blinkT = t; nextBlink = t + 1.5 + Math.random() * 3; }
    const bl = blinkT >= 0 && t - blinkT < 0.16 ? Math.sin((t - blinkT) / 0.16 * Math.PI) : 0;
    for (const k of ['AK_09_EyeBlinkLeft', 'AK_10_EyeBlinkRight']) if (morph[k] !== undefined) inf[morph[k]] = bl;
    const eyes = Math.sin(t * 1.3) * 0.5 + Math.sin(t * 3.1) * 0.3;
    if (morph.AU_61_EyesTurnLeft !== undefined) {
      inf[morph.AU_61_EyesTurnLeft] = Math.max(0, eyes); inf[morph.AU_62_EyesTurnRight] = Math.max(0, -eyes);
    }
  }
}

// Where her body is, in desk coordinates: feet on the desk, hanging from your fingers, or falling.
let toeOffY = 0;
function placeBody(dt) {
  woman.updateMatrixWorld(true);
  // how far her lowest toe sits below her origin (changes as her knees bend or legs kick)
  stage.worldToLocal(bones.LeftToe.getWorldPosition(toeL));
  stage.worldToLocal(bones.RightToe.getWorldPosition(toeR));
  toeOffY = Math.min(toeL.y, toeR.y) - woman.position.y;
  if (state === 'held') {
    // her chest sits exactly at your grip (eased in over the first moment, so the pickup isn't a jump)
    grabAge += dt;
    const e = Math.max(0, 1 - grabAge / 0.22);
    tmpV.copy(gripLocal).addScaledVector(grabEase, e * e);
    stage.worldToLocal(bones.Spine2.getWorldPosition(chestW));
    woman.position.add(tmpV.sub(chestW));
    if (woman.position.y + toeOffY < 0) woman.position.y = -toeOffY;      // feet never sink into the desk
    vel.copy(gripVel);

    og.beginPath(); og.moveTo(...path[0]); for (const p of path.slice(1)) og.lineTo(...p); og.stroke();
  }
  og.globalAlpha = 1;
  og.globalCompositeOperation = 'source-in';               // keep only the camera picture inside the thumb shape
  const w = frameCv.width, h = frameCv.height, s = Math.max(innerWidth / w, innerHeight / h);
  og.drawImage(frameCv, (innerWidth - w * s) / 2, (innerHeight - h * s) / 2, w * s, h * s);
  og.globalCompositeOperation = 'source-over';
}

// ---------- her voice: screams, sobs, begging ----------
// Screams are synthesized once at start (a buzzing "vocal cord" tone shaped by the resonances of
// an open, screaming mouth, with vibrato, strain and breath) and saved as little sound files.
// They play through a normal media player, which iPhone's silent switch doesn't mute (it does
// mute raw web audio). Words use the phone's own voice, pitched up for her size.
// voice.mouth (0..1) is how loud she is right now and drives her jaw.
const voice = (() => {
  const SR = 22050;
  const clips = { scream: [], sob: [], yelp: [], big: [] };
  let player = null, clip = null, queue = [], muted = false, ready = false, talker = null;
  let mouth = 0, busyUntil = 0, nextAt = 0, heldTurn = 0, pendingLine = null;
  const GROUND = ['Help! Somebody help me!', 'Please, leave me alone!', 'Help me!', "Don't hurt me, please!", 'Somebody, please!'];
  const HELD = ['Put me down! Please put me down!', 'No, no, no, no! Please!', 'Let me go! Please, let me go!',
                "I'm begging you, put me down!", "Please! Don't drop me!", 'Stop! Please stop!'];
  const LANDED = ["Please... please don't do that again.", 'Why are you doing this to me?', 'Please, just let me go.'];
  const pick = a => a[Math.random() * a.length | 0];
  const talking = () => 'speechSynthesis' in window && speechSynthesis.speaking;

  function wavUrl(data) {                                  // 16-bit mono WAV file in memory
    const b = new DataView(new ArrayBuffer(44 + data.length * 2)), str = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); b.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVEfmt ');
    b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
    b.setUint32(24, SR, true); b.setUint32(28, SR * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
    str(36, 'data'); b.setUint32(40, data.length * 2, true);
    for (let i = 0; i < data.length; i++) b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 0x7fff, true);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  }
  async function render(dur, pitch, sob = false) {
    const ac = new OfflineAudioContext(1, Math.ceil(SR * (dur + 0.1)), SR);
    const f0 = (sob ? 440 : 660) * pitch, src = ac.createOscillator(), f = src.frequency;
    src.type = 'sawtooth';
    if (sob) { f.setValueAtTime(f0, 0); f.linearRampToValueAtTime(f0 * 1.25, dur * 0.25); f.exponentialRampToValueAtTime(f0 * 0.7, dur); }
    else { f.setValueAtTime(f0 * 0.75, 0); f.exponentialRampToValueAtTime(f0 * 1.2, 0.12);
           f.linearRampToValueAtTime(f0 * 1.05, dur * 0.65); f.exponentialRampToValueAtTime(f0 * 0.6, dur); }
    for (const [hz, depth] of [[6.5, 0.035], [11, 0.015]]) {      // vibrato and a nervous wobble
      const l = ac.createOscillator(), g = ac.createGain();
      l.frequency.value = hz * (0.9 + Math.random() * 0.2); g.gain.value = f0 * depth;
      l.connect(g).connect(f); l.start(0); l.stop(dur + 0.1);
    }
    const shaper = ac.createWaveShaper(), curve = new Float32Array(256);   // vocal strain: soft clipping
    for (let i = 0; i < 256; i++) curve[i] = Math.tanh((i / 128 - 1) * 2.5);
    shaper.curve = curve;
    const pre = ac.createGain(); pre.gain.value = 0.6;
    src.connect(pre).connect(shaper);
    const env = ac.createGain(); env.gain.value = 0;
    for (const [fr, q, g] of [[sob ? 800 : 1050, 5, 1], [sob ? 1300 : 1650, 7, 0.5], [2900, 9, 0.28], [3900, 10, 0.12]]) {
      const bp = ac.createBiquadFilter(), gg = ac.createGain();  // the open mouth: resonances of "aaah"
      bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q; gg.gain.value = g;
      shaper.connect(bp).connect(gg).connect(env);
    }
    const nbuf = ac.createBuffer(1, Math.ceil(SR * (dur + 0.1)), SR), ch = nbuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const n = ac.createBufferSource(), nb = ac.createBiquadFilter(), ng = ac.createGain();   // breath and rasp
    n.buffer = nbuf; nb.type = 'bandpass'; nb.frequency.value = 2400; nb.Q.value = 0.8; ng.gain.value = sob ? 0.35 : 0.18;
    n.connect(nb).connect(ng).connect(env);
    env.gain.setValueAtTime(0, 0); env.gain.linearRampToValueAtTime(1, 0.05);
    env.gain.setValueAtTime(1, dur * 0.7); env.gain.linearRampToValueAtTime(0.0001, dur);
    env.connect(ac.destination);
    src.start(0); src.stop(dur + 0.05); n.start(0); n.stop(dur + 0.05);
    const data = (await ac.startRendering()).getChannelData(0);
    let peak = 0; for (const x of data) peak = Math.max(peak, Math.abs(x));
    for (let i = 0; i < data.length; i++) data[i] *= 0.95 / (peak || 1);           // as loud as possible
    const step = SR / 50, loud = [];                                                // loudness every 20 ms, for her jaw
    for (let i = 0; i < data.length; i += step) { let s = 0; for (let j = i; j < Math.min(i + step, data.length); j++) s += data[j] * data[j]; loud.push(Math.sqrt(s / step)); }
    const top = Math.max(...loud) || 1;
    return { url: wavUrl(data), loud: loud.map(x => x / top), dur };
  }
  async function build() {
    try {
      for (let i = 0; i < 6; i++) clips.scream.push(await render(0.9 + i * 0.18, 1 + (i % 3) * 0.07));
      for (let i = 0; i < 3; i++) clips.sob.push(await render(1.2 + i * 0.2, 0.82 + i * 0.05, true));
      clips.yelp.push(await render(0.4, 0.95));
      clips.big.push(await render(1.7, 1.15));
      ready = true;
    } catch (e) { diag.sound = 'no synth: ' + (e.message || e); }
  }
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    talker = vs.find(v => /samantha|karen|moira|tessa|serena|victoria|zira|aria|jenny|female|google us english/i.test(v.name)) || vs[0] || null;
  }
  function start() {                       // must run inside the tap that starts the game (iPhone rule)
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    player = new Audio(); player.setAttribute('playsinline', '');
    player.src = wavUrl(new Float32Array(SR / 10));       // a moment of silence unlocks the player for later
    player.play().then(() => { if (!diag.sound.startsWith('blocked')) diag.sound = 'on'; })
                 .catch(e => diag.sound = 'blocked: ' + e.name);
    player.onended = () => { if (queue.length) play(queue.shift()); };
    if ('speechSynthesis' in window) {
      speechSynthesis.speak(new SpeechSynthesisUtterance(' '));   // unlocks speech on iPhone
      pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;
    }
    build();
  }
  function play(kind) {
    if (!ready || muted || !player || !clips[kind].length) return;
    clip = pick(clips[kind]);
    player.src = clip.url;
    player.play().then(() => diag.sound = 'on').catch(e => diag.sound = 'blocked: ' + e.name);
    busyUntil = performance.now() + clip.dur * 1000;
  }
  function say(text, urgent) {
    if (muted || !('speechSynthesis' in window)) return;
    if (urgent) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (talker) u.voice = talker;
    u.pitch = 1.7; u.rate = urgent ? 1.25 : 1.1;
    speechSynthesis.speak(u);
  }
  return {
    start,
    get mouth() { return mouth; },
    get ready() { return ready; },
    toggleMute() {
      muted = !muted;
      if (muted) { player?.pause(); queue.length = 0; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
      return muted;
    },
    grabbed() { if ('speechSynthesis' in window) speechSynthesis.cancel(); queue.length = 0; play('big'); heldTurn = 1; },
    landed() { queue = ['sob']; play('yelp'); pendingLine = pick(LANDED); nextAt = performance.now() + 2600; },
    update() {
      // jaw follows the loudness of the scream playing right now, or flutters while she talks
      let level = 0;
      if (clip && player && !player.paused) level = clip.loud[Math.floor(player.currentTime * 50)] || 0;
      const talk = talking() ? 0.3 + 0.35 * Math.abs(Math.sin(performance.now() / 85)) : 0;
      mouth += (Math.min(1, Math.max(level, talk)) - mouth) * 0.35;
      if (!ready || muted) return;
      const now = performance.now();
      if (now < busyUntil + 250 || talking() || queue.length) return;
      if (state === 'held') {                                     // held: screams and begging, back to back
        heldTurn++ % 2 ? say(pick(HELD)) : play('scream');
        busyUntil = Math.max(busyUntil, now + 400);
      } else if (state === 'ground' && now > nextAt) {            // on the desk: terrified screams, sobs, cries for help
        const r = Math.random();
        if (pendingLine) { say(pendingLine); pendingLine = null; }
        else if (r < 0.5) play('scream');
        else if (r < 0.72) play('sob');
        else say(pick(GROUND));
        nextAt = now + (2 + Math.random() * 4 * (1.3 - fear)) * 1000;
      }
    },
  };
})();
window.__voice = voice;

// ---------- start ----------
$('go').onclick = async () => {
  voice.start();
  try {   // iOS asks for motion permission, and only from a tap
    if (typeof DeviceOrientationEvent?.requestPermission === 'function') await DeviceOrientationEvent.requestPermission();
  } catch {}
  try {
    if (location.search.includes('desk')) throw new Error('desk preview');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    $('cam').srcObject = stream; $('cam').hidden = false; await $('cam').play();
    initHands();
  } catch (e) {
    $('desk').hidden = false;   // no camera (e.g. desktop): fake desk backdrop, drag to look
    $('msg').textContent = 'No camera found. Drag to look around. Click her to pick her up.';
  }
  $('start').hidden = true; $('ui').hidden = false; $('diag').hidden = false;
  setTimeout(() => { camera.updateMatrixWorld(); placeInFront(); }, 400);   // let the gyro report first
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function frame(dt, t) {
  if (gyro) applyGyro(); else camera.quaternion.setFromEuler(eul.set(pitch, -yaw, 0, 'YXZ'));
  camera.updateMatrixWorld();
  trackHand();
  followHand(dt);
  if (state === 'held') updateHold();      // she stays under your finger even as you turn the phone
  voice.update(dt);
  pose(t, dt);
  renderer.render(scene, camera);
  drawThumb();
  if ((diagT += dt) > 0.25) {
    diagT = 0;
    $('diag').textContent = `sound: ${diag.sound}${voice.ready ? '' : ' (preparing)'} · hands: ${diag.hands}` +
      (diag.fps ? ` ${diag.fps}/s` : '') + ` · hand: ${diag.seen ? 'seen' : 'none'}` +
      (diag.seen ? ` · gap ${diag.gap.toFixed(2)}` : '') + ` · ${state}`;
  }
}
let diagT = 0;
document.body.appendChild(occ); sizeOcc();
addEventListener('resize', sizeOcc);
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.05); frame(dt, clock.elapsedTime); });
window.__frame = frame;                    // lets a test step the scene by hand
window.__state = () => ({ state, fear, hb, pos: woman?.position.toArray() });
window.__finger = () => [(finger.x + 1) / 2 * innerWidth, (1 - finger.y) / 2 * innerHeight];
window.__pend = () => [pend.x, pend.z, gripAcc.x, gripAcc.z].map(v => +v.toFixed(2));
</script>
